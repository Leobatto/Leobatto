name: Configure Cloudflare DNS once

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/cloudflare-dns-once.yml

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ZONE: leobatto.com
      VERCEL_TARGET: 5fd63484c3590758.vercel-dns-017.com
    steps:
      - name: Update apex and www records
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CF_API_TOKEN" ]; then
            echo "Required GitHub secret is not configured."
            exit 1
          fi

          api="https://api.cloudflare.com/client/v4"
          zone_json=$(curl --silent --show-error --fail \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            "$api/zones?name=$CF_ZONE&status=active")
          zone_id=$(echo "$zone_json" | jq -er '.result | if length == 1 then .[0].id else error("Zone not uniquely resolved") end')

          replace_record() {
            local name="$1"
            local records record_id payload response
            records=$(curl --silent --show-error --fail \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              "$api/zones/$zone_id/dns_records?name=$name&per_page=100")

            while IFS= read -r record_id; do
              [ -z "$record_id" ] && continue
              curl --silent --show-error --fail -X DELETE \
                -H "Authorization: Bearer $CF_API_TOKEN" \
                -H "Content-Type: application/json" \
                "$api/zones/$zone_id/dns_records/$record_id" >/dev/null
            done < <(echo "$records" | jq -r '.result[] | select(.type == "A" or .type == "AAAA" or .type == "CNAME") | .id')

            payload=$(jq -cn --arg name "$name" --arg content "$VERCEL_TARGET" \
              '{type:"CNAME", name:$name, content:$content, ttl:1, proxied:false}')
            response=$(curl --silent --show-error --fail -X POST \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "$api/zones/$zone_id/dns_records")
            echo "$response" | jq -e '.success == true' >/dev/null
            echo "Configured $name as DNS-only CNAME."
          }

          replace_record "$CF_ZONE"
          replace_record "www.$CF_ZONE"
          echo "Cloudflare DNS configuration completed."
